<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<meta name="description" content="DeutschPfad — App para aprender alemán A2 a B2 con ejercicios interactivos y explicaciones en español.">
<title>DeutschPfad · Aprende alemán A2–B2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DeutschPfad — Hoja de estilos (mobile-first, responsive)
   ============================================================ */
:root{
  --green:#58cc02; --green-d:#46a302; --green-l:#d7ffb8;
  --red:#ff4b4b; --red-d:#ea2b2b; --red-l:#ffdfe0;
  --blue:#1cb0f6; --blue-d:#1899d6;
  --yellow:#ffc800; --gold:#ff9600;
  --purple:#a560e8;
  --bg:#f7f9fc; --card:#ffffff; --ink:#3c3c3c; --muted:#8a8f99;
  --line:#e5e7eb; --line-d:#d6dae0;
  --radius:16px; --shadow:0 2px 0 var(--line-d);
  --maxw:480px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--ink);
  min-height:100dvh; line-height:1.4;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
#app{max-width:var(--maxw); margin:0 auto; min-height:100dvh; position:relative; background:var(--bg);
  display:flex; flex-direction:column;}
.screen{display:none; flex:1; flex-direction:column; animation:fade .25s ease}
.screen.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Botones genéricos ---------- */
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:15px 18px; border-radius:14px; font-weight:800; font-size:16px;
  background:var(--green); color:#fff; border:none; box-shadow:0 4px 0 var(--green-d);
  letter-spacing:.4px; text-transform:uppercase; transition:transform .05s, box-shadow .05s;
  min-height:54px;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--green-d)}
.btn:disabled{background:#e5e7eb; color:#afb4bd; box-shadow:0 4px 0 #d6dae0; cursor:not-allowed}
.btn.secondary{background:#fff; color:var(--blue); box-shadow:0 4px 0 var(--line-d); border:2px solid var(--line)}
.btn.secondary:active{box-shadow:0 1px 0 var(--line-d)}
.btn.danger{background:var(--red); box-shadow:0 4px 0 var(--red-d)}
.btn.blue{background:var(--blue); box-shadow:0 4px 0 var(--blue-d)}
.btn.ghost{background:transparent; color:var(--muted); box-shadow:none; text-transform:none; font-weight:700}

/* ---------- Pantalla de perfiles ---------- */
.center-wrap{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;
  padding:28px 22px; gap:8px; text-align:center}
.logo{font-size:54px; line-height:1}
.brand{font-size:30px; font-weight:900; letter-spacing:.5px; margin:4px 0}
.brand .de{color:var(--ink)} .brand .pf{color:var(--green)}
.tag{color:var(--muted); font-weight:700; margin-bottom:18px}
.profiles{display:flex; flex-direction:column; gap:14px; width:100%; max-width:360px}
.profile-card{
  display:flex; align-items:center; gap:14px; background:var(--card); border:2px solid var(--line);
  border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); text-align:left; width:100%;
  transition:transform .06s, border-color .15s;
}
.profile-card:active{transform:scale(.98)}
.profile-card .av{width:54px; height:54px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-size:28px; flex:0 0 auto; color:#fff; font-weight:900}
.profile-card .info{flex:1; min-width:0}
.profile-card .pname{font-weight:900; font-size:18px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.profile-card .psub{color:var(--muted); font-size:13px; font-weight:700}
.profile-card .edit{color:var(--muted); font-size:20px; padding:6px}
.lvl-badge{display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px; font-weight:900; color:#fff}
.lvl-A2{background:var(--green)} .lvl-B1{background:var(--blue)} .lvl-B2{background:var(--purple)}

/* ---------- Cabecera de inicio (stats) ---------- */
.topbar{
  position:sticky; top:0; z-index:10; background:var(--card); border-bottom:2px solid var(--line);
  padding:10px 14px; display:flex; align-items:center; gap:10px;
  padding-top:max(10px, env(safe-area-inset-top));
}
.topbar .who{display:flex; align-items:center; gap:9px; flex:1; min-width:0}
.topbar .av{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:19px; color:#fff; font-weight:900; flex:0 0 auto}
.topbar .nm{font-weight:900; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.topbar .switch{font-size:13px; color:var(--blue); font-weight:800; padding:6px}
.stats{display:flex; gap:6px}
.stat{display:flex; align-items:center; gap:4px; font-weight:900; font-size:14px; padding:5px 9px;
  background:var(--bg); border-radius:20px}
.stat.fire{color:var(--gold)} .stat.xp{color:var(--blue)} .stat.done{color:var(--green)}

/* ---------- Selector de nivel ---------- */
.levels{display:flex; gap:8px; padding:14px 14px 4px}
.level-pill{flex:1; padding:10px 6px; border-radius:14px; font-weight:900; text-align:center;
  background:var(--card); border:2px solid var(--line); color:var(--muted); position:relative; font-size:14px;
  box-shadow:0 3px 0 var(--line-d)}
.level-pill .sub{display:block; font-size:10px; font-weight:800; opacity:.8; text-transform:uppercase}
.level-pill.sel.A2{border-color:var(--green); color:var(--green); box-shadow:0 3px 0 var(--green)}
.level-pill.sel.B1{border-color:var(--blue); color:var(--blue); box-shadow:0 3px 0 var(--blue)}
.level-pill.sel.B2{border-color:var(--purple); color:var(--purple); box-shadow:0 3px 0 var(--purple)}
.level-pill.locked{opacity:.55}

/* ---------- Mapa de unidades ---------- */
.units{padding:8px 14px 30px; display:flex; flex-direction:column; gap:18px}
.unit-card{background:var(--card); border:2px solid var(--line); border-radius:20px; overflow:hidden;
  box-shadow:var(--shadow)}
.unit-head{padding:14px 16px; color:#fff; display:flex; align-items:center; gap:12px}
.unit-head .uicon{font-size:30px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.unit-head .utext{flex:1; min-width:0}
.unit-head .utitle{font-weight:900; font-size:17px}
.unit-head .udesc{font-size:12.5px; opacity:.92; font-weight:700}
.unit-head .uprog{font-size:12px; font-weight:900; background:rgba(255,255,255,.25); padding:4px 10px;
  border-radius:20px; white-space:nowrap}
.unit-body{padding:14px 16px; display:flex; flex-wrap:wrap; gap:12px}
.unit-locked-msg{padding:16px; color:var(--muted); font-weight:800; font-size:13px; display:flex;
  align-items:center; gap:8px; justify-content:center}

/* ---------- Nodo de lección ---------- */
.lesson-node{display:flex; flex-direction:column; align-items:center; gap:5px; width:74px}
.node-circle{width:62px; height:62px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:25px; font-weight:900; color:#fff; position:relative; box-shadow:0 5px 0 rgba(0,0,0,.18);
  transition:transform .07s; border:none}
.node-circle:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.18)}
.node-circle.locked{background:#e1e4ea; color:#b3b9c4; box-shadow:0 5px 0 #cdd2db; cursor:not-allowed}
.node-circle.done{background:var(--green); box-shadow:0 5px 0 var(--green-d)}
.node-circle.avail{box-shadow:0 5px 0 rgba(0,0,0,.2)}
.node-circle.avail::after{content:''; position:absolute; inset:-7px; border-radius:50%;
  border:3px solid currentColor; opacity:.35; animation:pulse 1.8s infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.4}70%{transform:scale(1.15);opacity:0}100%{opacity:0}}
.lesson-node .lname{font-size:11px; font-weight:800; text-align:center; color:var(--muted); line-height:1.15}
.node-star{position:absolute; bottom:-4px; right:-4px; font-size:15px}

/* ---------- Pantalla de lección ---------- */
.lesson-top{display:flex; align-items:center; gap:12px; padding:14px;
  padding-top:max(14px, env(safe-area-inset-top))}
.close-x{font-size:26px; color:var(--muted); font-weight:900; padding:2px 8px; line-height:1}
.progress{flex:1; height:16px; background:var(--line); border-radius:20px; overflow:hidden}
.progress .bar{height:100%; width:0; background:var(--green); border-radius:20px;
  transition:width .35s cubic-bezier(.4,0,.2,1)}
.hearts{font-weight:900; color:var(--red); font-size:15px; display:flex; align-items:center; gap:3px}

.ex-area{flex:1; padding:6px 18px 16px; overflow-y:auto; display:flex; flex-direction:column}
.ex-kind{font-size:12px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:1px;
  margin:6px 0 10px}
.ex-q{font-size:21px; font-weight:800; margin-bottom:6px; line-height:1.35}
.ex-hint{color:var(--muted); font-weight:700; font-size:14px; margin-bottom:14px}
.blankline{display:inline-block; min-width:64px; border-bottom:3px solid var(--blue); margin:0 4px;
  text-align:center; font-weight:900; color:var(--blue)}

/* opciones (mc / fill) */
.opts{display:flex; flex-direction:column; gap:11px; margin-top:6px}
.opt{display:flex; align-items:center; gap:12px; padding:15px 16px; border:2px solid var(--line);
  border-radius:14px; background:var(--card); font-weight:800; font-size:16.5px; text-align:left;
  box-shadow:0 3px 0 var(--line-d); width:100%; transition:transform .05s; min-height:54px}
.opt:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line-d)}
.opt .kbd{width:26px; height:26px; border:2px solid var(--line); border-radius:7px; display:flex;
  align-items:center; justify-content:center; font-size:13px; color:var(--muted); flex:0 0 auto}
.opt.sel{border-color:var(--blue); background:#e8f7ff; color:var(--blue-d); box-shadow:0 3px 0 var(--blue)}
.opt.sel .kbd{border-color:var(--blue); color:var(--blue)}
.opt.ok{border-color:var(--green); background:var(--green-l); color:var(--green-d); box-shadow:0 3px 0 var(--green)}
.opt.bad{border-color:var(--red); background:var(--red-l); color:var(--red-d); box-shadow:0 3px 0 var(--red)}
.opt:disabled{opacity:1}

/* ordenar palabras */
.order-answer{min-height:58px; border-bottom:3px solid var(--line); display:flex; flex-wrap:wrap; gap:8px;
  padding:8px 4px; margin-bottom:18px; align-content:flex-start}
.order-bank{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.token{padding:11px 15px; border:2px solid var(--line); border-radius:12px; background:var(--card);
  font-weight:800; font-size:16.5px; box-shadow:0 3px 0 var(--line-d); transition:transform .05s; min-height:46px}
.token:active{transform:translateY(2px)}
.token.placed{background:#eef1f5; color:#aab; box-shadow:none; border-style:dashed}
.token.ghost{visibility:hidden}

/* texto libre */
.text-input{width:100%; padding:15px; font-size:18px; font-weight:700; font-family:inherit;
  border:2px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink);
  box-shadow:0 3px 0 var(--line-d); outline:none}
.text-input:focus{border-color:var(--blue); box-shadow:0 3px 0 var(--blue)}
.umlauts{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
.umlauts button{padding:9px 13px; border:2px solid var(--line); border-radius:10px; background:var(--card);
  font-weight:900; font-size:16px; box-shadow:0 2px 0 var(--line-d); min-width:42px}

/* ---------- Hoja de feedback ---------- */
.footer-area{padding:14px 18px; padding-bottom:max(16px, env(safe-area-inset-bottom));
  border-top:2px solid transparent; background:var(--bg)}
.feedback{border-radius:16px; padding:14px 16px 6px; margin-bottom:12px; display:none; animation:slideup .3s ease}
.feedback.show{display:block}
.feedback.good{background:var(--green-l)}
.feedback.bad{background:var(--red-l)}
@keyframes slideup{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.fb-title{display:flex; align-items:center; gap:9px; font-weight:900; font-size:18px; margin-bottom:4px}
.feedback.good .fb-title{color:var(--green-d)} .feedback.bad .fb-title{color:var(--red-d)}
.fb-correct{font-weight:800; margin:2px 0 6px; font-size:15px}
.feedback.good .fb-correct{color:var(--green-d)} .feedback.bad .fb-correct{color:var(--red-d)}
.fb-ex{font-size:14.5px; font-weight:700; line-height:1.5; padding-bottom:8px}
.feedback.good .fb-ex{color:#3a6b13} .feedback.bad .fb-ex{color:#9a2a2a}
.fb-ex b{font-weight:900}

.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}

/* ---------- Pantalla de resultado ---------- */
.result-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:30px 24px; gap:6px}
.result-emoji{font-size:80px; animation:pop .5s}
.result-title{font-size:27px; font-weight:900}
.result-sub{color:var(--muted); font-weight:700; margin-bottom:14px}
.result-stats{display:flex; gap:12px; width:100%; max-width:340px; margin-bottom:22px}
.rstat{flex:1; border:3px solid var(--yellow); border-radius:16px; overflow:hidden; background:#fffdf3}
.rstat.acc{border-color:var(--green); background:#f4ffe9}
.rstat .rh{background:var(--yellow); color:#fff; font-weight:900; font-size:12px; padding:4px; text-transform:uppercase}
.rstat.acc .rh{background:var(--green)}
.rstat .rv{padding:12px 4px; font-weight:900; font-size:24px}
.rstat.acc .rv{color:var(--green-d)} .rstat .rv{color:var(--gold)}

/* ---------- Toast ---------- */
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(80px);
  background:#2b2b2b; color:#fff; padding:12px 20px; border-radius:30px; font-weight:800; font-size:14px;
  z-index:100; opacity:0; transition:.3s; max-width:90%; text-align:center}
.toast.show{transform:translateX(-50%); opacity:1}

.foot-note{text-align:center; color:var(--muted); font-size:11px; font-weight:700; padding:14px}
@media (max-width:360px){ .ex-q{font-size:19px} .node-circle{width:56px;height:56px} .lesson-node{width:66px} }
@media (min-width:481px){ #app{box-shadow:0 0 40px rgba(0,0,0,.08)} }
</style>
</head>
<body>
<div id="app">

  <!-- ============ PANTALLA: PERFILES ============ -->
  <section id="screen-profiles" class="screen active">
    <div class="center-wrap">
      <div class="logo">🇩🇪</div>
      <div class="brand"><span class="de">Deutsch</span><span class="pf">Pfad</span></div>
      <div class="tag">Aprende alemán · A2 → B1 → B2</div>
      <div class="profiles" id="profiles-list"></div>
      <p class="foot-note">Tu progreso se guarda en este dispositivo (localStorage).</p>
    </div>
  </section>

  <!-- ============ PANTALLA: INICIO / MAPA ============ -->
  <section id="screen-home" class="screen">
    <div class="topbar">
      <div class="who">
        <div class="av" id="home-av">A</div>
        <div style="min-width:0">
          <div class="nm" id="home-name">Usuario</div>
          <button class="switch" onclick="goProfiles()">↺ Cambiar perfil</button>
        </div>
      </div>
      <div class="stats">
        <div class="stat fire">🔥<span id="stat-streak">0</span></div>
        <div class="stat xp">⭐<span id="stat-xp">0</span></div>
        <div class="stat done">✓<span id="stat-done">0</span></div>
      </div>
    </div>
    <div class="levels" id="levels"></div>
    <div class="units" id="units"></div>
    <p class="foot-note" id="home-foot"></p>
  </section>

  <!-- ============ PANTALLA: LECCIÓN ============ -->
  <section id="screen-lesson" class="screen">
    <div class="lesson-top">
      <button class="close-x" onclick="quitLesson()">✕</button>
      <div class="progress"><div class="bar" id="lesson-bar"></div></div>
      <div class="hearts" id="lesson-hearts">❤️ <span id="hearts-n">5</span></div>
    </div>
    <div class="ex-area" id="ex-area"></div>
    <div class="footer-area">
      <div class="feedback" id="feedback">
        <div class="fb-title" id="fb-title"></div>
        <div class="fb-correct" id="fb-correct"></div>
        <div class="fb-ex" id="fb-ex"></div>
      </div>
      <button class="btn" id="action-btn" onclick="onAction()" disabled>Comprobar</button>
    </div>
  </section>

  <!-- ============ PANTALLA: RESULTADO ============ -->
  <section id="screen-result" class="screen">
    <div class="result-wrap">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <div class="result-title" id="result-title">¡Lección completada!</div>
      <div class="result-sub" id="result-sub"></div>
      <div class="result-stats">
        <div class="rstat"><div class="rh">XP ganados</div><div class="rv" id="result-xp">+0</div></div>
        <div class="rstat acc"><div class="rh">Aciertos</div><div class="rv" id="result-acc">0%</div></div>
      </div>
      <button class="btn" onclick="finishToHome()">Continuar</button>
      <button class="btn ghost" onclick="repeatLesson()">Repetir lección</button>
    </div>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ================================================================
   DeutschPfad — Lógica de la aplicación
   ----------------------------------------------------------------
   ARQUITECTURA MODULAR (pensada para mantenimiento futuro):
     1) COURSE .......... datos del curso (niveles → unidades → lecciones → ejercicios)
     2) Persistencia .... estado de usuarios en localStorage
     3) Progresión ...... lógica de desbloqueo (niveles/unidades/lecciones)
     4) Motor ........... renderizado y corrección de ejercicios
     5) UI .............. navegación entre pantallas

   ───────────────────────────────────────────────────────────────
   INTEGRACIÓN FUTURA CON MCPs (Model Context Protocol) / Claude
   ───────────────────────────────────────────────────────────────
   El contenido pedagógico vive 100% en el objeto `COURSE`, separado
   del motor. Esto permite, en futuras iteraciones, sustituir o
   enriquecer los datos desde fuentes externas sin tocar la lógica:

     • Generación de contenido: un MCP conectado a Claude podría
       producir nuevas lecciones siguiendo el SCHEMA de ejercicios
       documentado más abajo y volcarlas en `COURSE`.
     • Validación gramatical: un MCP de validación de alemán
       (p. ej. LanguageTool/Hunspell expuesto vía MCP) podría revisar
       cada frase alemana antes de publicarla.
     • Diccionarios/corpus: MCPs con corpus DWDS, Wiktionary o
       Tatoeba podrían añadir ejemplos reales y audio.

   Punto de extensión recomendado: `loadExternalContent(provider)`
   (stub al final del archivo). Bastaría con que devuelva un objeto
   con el mismo SCHEMA y llamar a `mergeIntoCourse(data)`.

   SCHEMA de un ejercicio (todos los tipos comparten `t` y `ex`):
     { t:'mc',    q, opts:[...], a:idxCorrecto, ex:'explicación' }
     { t:'fill',  q (con '___'), opts:[...], a:idxCorrecto, ex }
     { t:'order', q, a:[tokens en orden correcto], ex }
     { t:'text',  q, accept:[respuestas válidas], a:'respuesta mostrada', ex }
   `ex` = explicación pedagógica en español (regla + ejemplo). Se
   muestra tanto al acertar (refuerzo) como al fallar (corrección).
   ================================================================ */

/* ============ 1) DATOS DEL CURSO ============ */
const COURSE = {
  A2: {
    name:"A2", subtitle:"Básico", color:"#58cc02",
    units:[
      {
        id:"A2-U1", title:"Saludos y Presentaciones", desc:"Saluda, despídete y preséntate",
        icon:"👋", color:"#58cc02",
        lessons:[
          { id:"A2-U1-L1", title:"Saludos básicos", ex:[
            { t:"mc", q:"¿Cómo se dice «Buenos días» (por la mañana) en alemán?",
              opts:["Guten Morgen","Guten Abend","Gute Nacht","Guten Tag"], a:0,
              ex:"<b>Guten Morgen</b> se usa por la mañana (hasta media mañana). <b>Guten Tag</b> sirve durante el día, <b>Guten Abend</b> por la tarde/noche y <b>Gute Nacht</b> solo al despedirse para dormir." },
            { t:"mc", q:"«Tschüss» significa…",
              opts:["Adiós (informal)","Hola","Gracias","Por favor"], a:0,
              ex:"<b>Tschüss</b> es una despedida informal. Para situaciones formales se usa <b>Auf Wiedersehen</b> (en persona) o <b>Auf Wiederhören</b> (por teléfono)." },
            { t:"fill", q:"___ heißen Sie? — ¿Cómo se llama usted?",
              opts:["Wie","Was","Wer","Wo"], a:0,
              ex:"<b>Wie</b> = «cómo». <b>Wie heißen Sie?</b> (formal) / <b>Wie heißt du?</b> (informal). Recuerda: Was = qué, Wer = quién, Wo = dónde." },
            { t:"text", q:"Escribe en alemán: «Gracias»", accept:["danke","danke schön","danke sehr","vielen dank"], a:"Danke",

            { t:"order", q:"Ordena: «Me llamo Anna»", a:["Ich","heiße","Anna"],

          { id:"A2-U1-L2", title:"Presentarse", ex:[

            { t:"fill", q:"Woher ___ du? — ¿De dónde vienes?",

            { t:"mc", q:"¿Cuál significa «¿Dónde vive usted?» (formal)?",

              ex:"<b>Sie</b> (formal) usa la forma de plural: <b>wohnen Sie</b>. <b>Wo</b> = dónde (lugar); <b>Woher</b> = de dónde (origen)." },
            { t:"text", q:"Traduce: «Vengo de Austria.»", accept:["ich komme aus österreich","ich komme aus oesterreich"], a:"Ich komme aus Österreich.",
              ex:"<b>aus</b> + país = origen. <b>Österreich</b> = Austria. Recuerda la mayúscula inicial en los nombres propios y sustantivos." },
            { t:"order", q:"Ordena: «Ella vive en Múnich»", a:["Sie","wohnt","in","München"],

/* ============ 2) PERSISTENCIA (localStorage) ============ */
const STORAGE_KEY = "deutschpfad_v1";
const AVATAR_COLORS = ["#58cc02","#1cb0f6","#ff9600","#a560e8"];

function defaultUser(name, color){
  return { name, color, xp:0, streak:0, lastActive:null, completed:[] };
}
let DB = loadDB();
let currentUserId = null;
let selectedLevel = "A2";

function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const d = JSON.parse(raw); if(d && d.users) return d; }
  }catch(e){ /* almacenamiento no disponible o corrupto: usar valores por defecto */ }
  return { users:{
    u1: defaultUser("Usuario 1", AVATAR_COLORS[0]),
    u2: defaultUser("Usuario 2", AVATAR_COLORS[1])
  }};
}
function saveDB(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch(e){ toast("⚠️ No se pudo guardar el progreso"); }
}
function user(){ return DB.users[currentUserId]; }

/* ============ 3) LÓGICA DE PROGRESIÓN / DESBLOQUEO ============ */
function allLessonIds(levelKey){
  const ids=[]; (COURSE[levelKey].units||[]).forEach(u=>u.lessons.forEach(l=>ids.push(l.id))); return ids;
}
function isCompleted(id){ return user().completed.includes(id); }
function levelHasContent(levelKey){ return (COURSE[levelKey].units||[]).length>0; }

function isLevelUnlocked(levelKey){
  if(levelKey==="A2") return true;
  if(levelKey==="B1") return allLessonIds("A2").every(isCompleted);
  if(levelKey==="B2") return levelHasContent("B1") && allLessonIds("B1").every(isCompleted);
  return false;
}
function isUnitUnlocked(levelKey, unitIdx){
  if(!isLevelUnlocked(levelKey)) return false;
  if(unitIdx===0) return true;
  const prev = COURSE[levelKey].units[unitIdx-1];
  return prev.lessons.every(l=>isCompleted(l.id));
}
function isLessonUnlocked(levelKey, unitIdx, lessonIdx){
  if(!isUnitUnlocked(levelKey, unitIdx)) return false;
  if(lessonIdx===0) return true;
  const prev = COURSE[levelKey].units[unitIdx].lessons[lessonIdx-1];
  return isCompleted(prev.id);
}
function currentLevelOf(){
  if(levelHasContent("B2") && isLevelUnlocked("B2")) return "B2";
  if(levelHasContent("B1") && isLevelUnlocked("B1")) return "B1";
  return "A2";
}

/* ============ 4) NAVEGACIÓN ENTRE PANTALLAS ============ */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ----- Pantalla de perfiles ----- */
function renderProfiles(){
  const wrap=document.getElementById("profiles-list"); wrap.innerHTML="";
  Object.keys(DB.users).forEach(uid=>{
    const u=DB.users[uid];
    const lvl=(()=>{ const prevId=currentUserId; currentUserId=uid; const L=currentLevelOf(); currentUserId=prevId; return L; })();
    const done=u.completed.length;
    const card=document.createElement("button");
    card.className="profile-card";
    card.onclick=()=>selectProfile(uid);
    card.innerHTML=`
      <div class="av" style="background:${u.color}">${escapeHtml(u.name.trim().charAt(0).toUpperCase()||"?")}</div>
      <div class="info">
        <div class="pname">${escapeHtml(u.name)}</div>
        <div class="psub"><span class="lvl-badge lvl-${lvl}">${lvl}</span> · 🔥${u.streak} · ⭐${u.xp} · ✓${done} lecc.</div>
      </div>
      <span class="edit" title="Editar nombre" onclick="event.stopPropagation(); editName('${uid}')">✏️</span>`;
    wrap.appendChild(card);
  });
}
function editName(uid){
  const u=DB.users[uid];
  const n=prompt("Nombre del perfil:", u.name);
  if(n && n.trim()){ u.name=n.trim().slice(0,20); saveDB(); renderProfiles(); }
}
function selectProfile(uid){
  currentUserId=uid; selectedLevel=currentLevelOf(); renderHome(); show("screen-home");
}
function goProfiles(){ renderProfiles(); show("screen-profiles"); }

/* ----- Pantalla de inicio (mapa) ----- */
function renderHome(){
  const u=user();
  document.getElementById("home-av").textContent=u.name.trim().charAt(0).toUpperCase()||"?";
  document.getElementById("home-av").style.background=u.color;
  document.getElementById("home-name").textContent=u.name;
  document.getElementById("stat-streak").textContent=u.streak;
  document.getElementById("stat-xp").textContent=u.xp;
  document.getElementById("stat-done").textContent=u.completed.length;
  renderLevels(); renderUnits();
  const total=allLessonIds("A2").length+allLessonIds("B1").length+allLessonIds("B2").length;
  document.getElementById("home-foot").textContent=`${u.completed.length} de ${total} lecciones completadas · DeutschPfad`;
}
function renderLevels(){
  const box=document.getElementById("levels"); box.innerHTML="";
  ["A2","B1","B2"].forEach(k=>{
    const lv=COURSE[k]; const unlocked=isLevelUnlocked(k); const has=levelHasContent(k);
    const pill=document.createElement("button");
    pill.className=`level-pill ${k} ${selectedLevel===k?"sel":""} ${(!unlocked||!has)?"locked":""}`;
    pill.innerHTML=`${unlocked?"":"🔒 "}${lv.name}<span class="sub">${lv.subtitle}</span>`;
    pill.onclick=()=>{
      if(!has){ toast("🔜 Próximamente más contenido en "+k); return; }
      if(!unlocked){ toast("🔒 Completa el nivel anterior para desbloquear "+k); return; }
      selectedLevel=k; renderLevels(); renderUnits();
    };
    box.appendChild(pill);
  });
}
function renderUnits(){
  const box=document.getElementById("units"); box.innerHTML="";
  const lv=COURSE[selectedLevel]; const units=lv.units||[];
  if(units.length===0){
    box.innerHTML=`<div class="unit-card"><div class="unit-locked-msg">🔜 El contenido de ${selectedLevel} se añadirá próximamente. La estructura ya está lista para ampliarse.</div></div>`;
    return;
  }
  units.forEach((unit, ui)=>{
    const uUnlocked=isUnitUnlocked(selectedLevel, ui);
    const doneCount=unit.lessons.filter(l=>isCompleted(l.id)).length;
    const card=document.createElement("div"); card.className="unit-card";
    let nodes="";
    unit.lessons.forEach((les, li)=>{
      const unlocked=isLessonUnlocked(selectedLevel, ui, li);
      const done=isCompleted(les.id);
      const cls=done?"done":(unlocked?"avail":"locked");
      const inner=done?"✓":(unlocked?(li+1):"🔒");
      const star=done?'<span class="node-star">⭐</span>':"";
      const style=(unlocked&&!done)?`style="background:${unit.color};color:#fff"`:"";
      nodes+=`<div class="lesson-node">
        <button class="node-circle ${cls}" ${style} ${unlocked?"":"disabled"}
          onclick="startLesson('${selectedLevel}',${ui},${li})">${inner}${star}</button>
        <div class="lname">${escapeHtml(les.title)}</div>
      </div>`;
    });
    card.innerHTML=`
      <div class="unit-head" style="background:${unit.color}">
        <div class="uicon">${unit.icon}</div>
        <div class="utext">
          <div class="utitle">${uUnlocked?"":"🔒 "}${escapeHtml(unit.title)}</div>
          <div class="udesc">${escapeHtml(unit.desc)}</div>
        </div>
        <div class="uprog">${doneCount}/${unit.lessons.length}</div>
      </div>
      ${uUnlocked
        ? `<div class="unit-body">${nodes}</div>`
        : `<div class="unit-locked-msg">🔒 Completa la unidad anterior para desbloquear</div>`}`;
    box.appendChild(card);
  });
}

/* ============ 5) MOTOR DE LECCIONES ============ */
let L = null; // estado de la lección activa

function startLesson(levelKey, unitIdx, lessonIdx){
  const les=COURSE[levelKey].units[unitIdx].lessons[lessonIdx];
  L={ levelKey, unitIdx, lessonIdx, lesson:les,
      items:les.ex.map(e=>e), idx:0, correct:0, answered:false,
      selected:null, built:[], bank:[] };
  show("screen-lesson");
  renderExercise();
}
function quitLesson(){
  if(confirm("¿Salir de la lección? Perderás el progreso de esta sesión.")){ renderHome(); show("screen-home"); }
}
function repeatLesson(){ startLesson(L.levelKey, L.unitIdx, L.lessonIdx); }

function setProgress(){
  const pct=(L.idx/L.items.length)*100;
  document.getElementById("lesson-bar").style.width=pct+"%";
}
function renderExercise(){
  L.answered=false; L.selected=null; L.built=[];
  setProgress();
  const ex=L.items[L.idx];
  const area=document.getElementById("ex-area");
  const kindLabel={mc:"Elige la opción correcta",fill:"Completa la frase",order:"Ordena las palabras",text:"Escribe en alemán"}[ex.t];
  let html=`<div class="ex-kind">${kindLabel}</div>`;

  if(ex.t==="mc"){
    html+=`<div class="ex-q">${ex.q}</div><div class="opts" id="opts"></div>`;
  } else if(ex.t==="fill"){
    const q=ex.q.replace("___",'<span class="blankline" id="blank">&nbsp;&nbsp;&nbsp;</span>');
    html+=`<div class="ex-q">${q}</div><div class="opts" id="opts"></div>`;
  } else if(ex.t==="order"){
    html+=`<div class="ex-q">${ex.q}</div>
      <div class="order-answer" id="order-answer"></div>
      <div class="order-bank" id="order-bank"></div>`;
  } else if(ex.t==="text"){
    html+=`<div class="ex-q">${ex.q}</div>
      <input class="text-input" id="text-input" type="text" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" placeholder="Tu respuesta…">
      <div class="umlauts">
        <button type="button" onclick="insChar('ä')">ä</button>
        <button type="button" onclick="insChar('ö')">ö</button>
        <button type="button" onclick="insChar('ü')">ü</button>
        <button type="button" onclick="insChar('ß')">ß</button>
      </div>`;
  }
  area.innerHTML=html;

  // hidratar controles según tipo
  if(ex.t==="mc"||ex.t==="fill"){
    const box=document.getElementById("opts");
    ex.opts.forEach((o,i)=>{
      const b=document.createElement("button");
      b.className="opt"; b.dataset.i=i;
      b.innerHTML=`<span class="kbd">${i+1}</span><span>${escapeHtml(o)}</span>`;
      b.onclick=()=>selectOpt(i);
      box.appendChild(b);
    });
  } else if(ex.t==="order"){
    L.bank=shuffleNoIdentity(ex.a);
    renderOrder();
  } else if(ex.t==="text"){
    const inp=document.getElementById("text-input");
    inp.addEventListener("input",()=>setAction(inp.value.trim().length>0));
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); onAction(); }});
    setTimeout(()=>inp.focus(),60);
  }

  // resetear feedback y botón
  const fb=document.getElementById("feedback"); fb.className="feedback";
  const btn=document.getElementById("action-btn");
  btn.textContent="Comprobar"; btn.className="btn";
  setAction(false);
}

function setAction(enabled){ document.getElementById("action-btn").disabled=!enabled; }

/* --- selección en mc/fill --- */
function selectOpt(i){
  if(L.answered) return;
  L.selected=i;
  document.querySelectorAll("#opts .opt").forEach(b=>b.classList.toggle("sel", +b.dataset.i===i));
  const ex=L.items[L.idx];
  if(ex.t==="fill"){ const bl=document.getElementById("blank"); if(bl) bl.textContent=ex.opts[i]; }
  setAction(true);
}

/* --- ordenar palabras --- */
function renderOrder(){
  const ans=document.getElementById("order-answer");
  const bank=document.getElementById("order-bank");
  ans.innerHTML=""; bank.innerHTML="";
  L.built.forEach((w,idx)=>{
    const t=document.createElement("button"); t.className="token"; t.textContent=w;
    t.onclick=()=>{ if(L.answered) return; L.built.splice(idx,1); L.bank.push(w); renderOrder(); };
    ans.appendChild(t);
  });
  L.bank.forEach((w,idx)=>{
    const t=document.createElement("button"); t.className="token"; t.textContent=w;
    t.onclick=()=>{ if(L.answered) return; L.bank.splice(idx,1); L.built.push(w); renderOrder(); };
    bank.appendChild(t);
  });
  setAction(L.built.length===L.items[L.idx].a.length);
}

/* --- teclado de umlauts --- */
function insChar(c){
  const inp=document.getElementById("text-input"); if(!inp) return;
  const s=inp.selectionStart??inp.value.length, e=inp.selectionEnd??inp.value.length;
  inp.value=inp.value.slice(0,s)+c+inp.value.slice(e);
  inp.focus(); inp.setSelectionRange(s+1,s+1);
  setAction(inp.value.trim().length>0);
}

/* --- normalización para texto libre --- */
function norm(s){
  return (s||"").toLowerCase().trim()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[.,!?;:¡¿"«»()]/g,"").replace(/\s+/g," ").trim();
}

/* --- comprobar / continuar --- */
function onAction(){
  if(!L.answered){ checkAnswer(); }
  else { nextExercise(); }
}
function checkAnswer(){
  const ex=L.items[L.idx]; let ok=false; let correctText="";
  if(ex.t==="mc"||ex.t==="fill"){
    ok=(L.selected===ex.a); correctText=ex.opts[ex.a];
    document.querySelectorAll("#opts .opt").forEach(b=>{
      const i=+b.dataset.i; b.disabled=true;
      if(i===ex.a) b.classList.add("ok");
      else if(i===L.selected) b.classList.add("bad");
      b.classList.remove("sel");
    });
  } else if(ex.t==="order"){
    ok=(L.built.join("\u0001")===ex.a.join("\u0001")); correctText=ex.a.join(" ");
  } else if(ex.t==="text"){
    const val=document.getElementById("text-input").value;
    ok=ex.accept.map(norm).includes(norm(val)); correctText=ex.a;
    const inp=document.getElementById("text-input"); inp.disabled=true;
    inp.style.borderColor=ok?"var(--green)":"var(--red)";
    inp.style.boxShadow=ok?"0 3px 0 var(--green)":"0 3px 0 var(--red)";
  }
  L.answered=true;
  if(ok) L.correct++;
  showFeedback(ok, correctText, ex.ex);
}
function showFeedback(ok, correctText, explanation){
  const fb=document.getElementById("feedback");
  fb.className="feedback show "+(ok?"good":"bad");
  document.getElementById("fb-title").innerHTML = ok
    ? '✅ <span>¡Richtig! (¡Correcto!)</span>'
    : '❌ <span>Nicht ganz… (No del todo)</span>';
  document.getElementById("fb-correct").innerHTML = ok ? "" : `Respuesta correcta: <b>${escapeHtml(correctText)}</b>`;
  document.getElementById("fb-ex").innerHTML = explanation;
  const area=document.getElementById("ex-area");
  area.classList.remove("shake","pop"); void area.offsetWidth;
  area.classList.add(ok?"pop":"shake");
  const btn=document.getElementById("action-btn");
  btn.textContent = L.idx===L.items.length-1 ? "Finalizar" : "Continuar";
  btn.className="btn "+(ok?"":"danger");
  setAction(true);
  // navegación por teclado físico (Enter)
}
function nextExercise(){
  L.idx++;
  if(L.idx>=L.items.length){ finishLesson(); return; }
  renderExercise();
}

/* --- fin de lección: XP, racha, desbloqueo --- */
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function yesterdayStr(){ const d=new Date(Date.now()-86400000); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function updateStreak(u){
  const t=todayStr();
  if(u.lastActive===t) return;
  u.streak = (u.lastActive===yesterdayStr()) ? u.streak+1 : 1;
  u.lastActive=t;
}
function finishLesson(){
  setProgress();
  const u=user();
  const total=L.items.length;
  const acc=Math.round((L.correct/total)*100);
  const base=L.correct*10;
  const firstTime=!isCompleted(L.lesson.id);
  const bonus=firstTime?20:0;
  const perfect=(L.correct===total)?10:0;
  const earned=base+bonus+perfect;
  u.xp+=earned;
  if(firstTime) u.completed.push(L.lesson.id);
  updateStreak(u);
  saveDB();

  // pantalla de resultado
  document.getElementById("result-emoji").textContent = acc>=80?"🏆":(acc>=60?"🎉":"💪");
  document.getElementById("result-title").textContent = acc>=80?"¡Ausgezeichnet!":(acc>=60?"¡Gut gemacht!":"¡Sigue así!");
  document.getElementById("result-sub").textContent = `${L.correct} de ${total} aciertos · ${L.lesson.title}`;
  document.getElementById("result-xp").textContent = "+"+earned;
  document.getElementById("result-acc").textContent = acc+"%";
  show("screen-result");
}
function finishToHome(){ selectedLevel=L.levelKey; renderHome(); show("screen-home"); }

/* ============ UTILIDADES ============ */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function shuffleNoIdentity(a){
  if(a.length<2) return a.slice();
  let s; let tries=0;
  do{ s=shuffle(a); tries++; }while(s.join("\u0001")===a.join("\u0001") && tries<8);
  return s;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
