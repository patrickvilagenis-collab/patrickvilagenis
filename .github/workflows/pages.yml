name: Deploy SafeField to GitHub Pages

# Publishes the static Safety Platform (safety-platform/) to GitHub Pages.
# Requires the repository to be public (GitHub Free) or a paid plan for
# private Pages. The first run enables Pages automatically (enablement: true).

on:
  push:
    branches: [safety-health-tool, main]
    paths: ['safety-platform/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./safety-platform

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
