[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agente"
version = "1.0.0"
description = "Sistema de Agentes IA: un agente agéntico en cinco bloques (Cerebro, Manos, Memoria, Loops, Verificación)."
readme = "agente/README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    # Única dependencia del sistema de agentes: el SDK oficial de Anthropic.
    # Versión reciente con razonamiento adaptativo, structured outputs y
    # búsqueda web server-side.
    "anthropic>=0.49.0",
]

[project.scripts]
# Permite ejecutar el demo como comando tras instalar:  agente-demo "tu objetivo"
agente-demo = "agente.demo:main"

[tool.setuptools]
# Empaquetamos solo el framework de agentes; `src/` es la app de escritorio aparte.
packages = ["agente"]
