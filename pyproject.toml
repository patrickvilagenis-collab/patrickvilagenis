[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asistente-pro"
description = "Asistente de productividad: lee correo y calendario de Microsoft 365 y usa Claude para resumir, generar actas (MoM) y planificar."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Patrick Vilagenis" }]
dynamic = ["version"]

# Núcleo "agente" (sin GUI): correo/calendario (Microsoft Graph) + IA (Claude).
dependencies = [
    "anthropic>=0.49.0",
    "msal>=1.28.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# GUI de escritorio (pestañas con customtkinter).
app = [
    "customtkinter>=5.2.2",
]
# Empaquetado del .exe portable (Windows).
build = [
    "pyinstaller>=6.0",
]

[project.gui-scripts]
# Lanza la interfaz gráfica (requiere el extra [app]).
asistente-pro = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.dynamic]
version = { attr = "src.__version__" }
